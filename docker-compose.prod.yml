services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: portfolio-prod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - tunnel

networks:
  tunnel:
    external: true